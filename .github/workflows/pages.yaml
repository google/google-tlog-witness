name: Deploy GitHub Pages

on:
  push:
    branches: [main]

# Allow only one Pages deployment at a time. Queued runs are collapsed to the
# latest, but an in-flight deployment is never cancelled, so a rapid sequence
# of merges cannot abort a production deploy partway through.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        run: |
          mkdir -p _site
          cp site/index.html _site/index.html
          cp site/style.css _site/style.css
          cp logs/log-list-10qps-10klogs.txt _site/log-list-10qps-10klogs.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
